basePath: /
definitions:
  domain.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  domain.Brand:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      logo_url:
        type: string
      name:
        type: string
    type: object
  domain.CheckoutInput:
    properties:
      coupon_code:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.CheckoutItemInput'
        type: array
    type: object
  domain.CheckoutItemInput:
    properties:
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
  domain.ConfirmPaymentInput:
    properties:
      amount:
        type: number
      order_id:
        type: integer
      payment_method:
        type: string
      transaction_ref:
        type: string
    type: object
  domain.CreatePaymentIntentInput:
    properties:
      order_id:
        type: integer
      payment_method:
        description: credit_card, promptpay, truemoney
        type: string
    type: object
  domain.CreateProductInput:
    properties:
      brand_id:
        type: integer
      category_id:
        type: integer
      description:
        type: string
      image_url:
        type: string
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      specs:
        additionalProperties: {}
        type: object
      stock:
        type: integer
    type: object
  domain.FlashSale:
    properties:
      created_at:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      items:
        items:
          $ref: '#/definitions/domain.FlashSaleItem'
        type: array
      starts_at:
        type: string
      title:
        type: string
    type: object
  domain.FlashSaleItem:
    properties:
      created_at:
        type: string
      flash_price:
        type: number
      flash_sale_id:
        type: integer
      flash_stock:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      original_price:
        type: number
      product_id:
        type: integer
      product_name:
        type: string
      sold_count:
        type: integer
    type: object
  domain.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  domain.Order:
    properties:
      coupon_id:
        description: "\U0001F448 คูปองที่ใช้"
        type: integer
      created_at:
        type: string
      discount_amount:
        description: "\U0001F448 ยอดส่วนลดจากคูปอง"
        type: number
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      status:
        description: pending, paid, cancelled
        type: string
      total_amount:
        type: number
      user_id:
        type: integer
    type: object
  domain.OrderItem:
    properties:
      created_at:
        type: string
      id:
        type: integer
      order_id:
        type: integer
      price:
        description: ราคา ณ วันที่สั่งซื้อ
        type: number
      product_id:
        type: integer
      product_name:
        description: สำหรับแสดงชื่อสินค้าเวลา Query
        type: string
      quantity:
        type: integer
    type: object
  domain.Payment:
    properties:
      amount:
        type: number
      id:
        type: integer
      order_id:
        type: integer
      paid_at:
        type: string
      payment_method:
        type: string
      status:
        type: string
      transaction_ref:
        type: string
    type: object
  domain.PaymentIntentResponse:
    properties:
      amount:
        type: number
      order_id:
        type: integer
      payment_method:
        type: string
      payment_url:
        description: สำหรับบัตรเครดิต
        type: string
      qr_code_data:
        description: สำหรับ PromptPay
        type: string
      status:
        type: string
      transaction_ref:
        type: string
    type: object
  domain.Product:
    properties:
      brand_id:
        type: integer
      brand_name:
        type: string
      category_id:
        type: integer
      category_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      name:
        type: string
      price:
        type: number
      rating:
        type: number
      reviews_count:
        type: integer
      sku:
        type: string
      specs:
        additionalProperties: {}
        type: object
      stock:
        type: integer
    type: object
  domain.Promotion:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      discount_type:
        description: '"fixed" หรือ "percentage"'
        type: string
      discount_value:
        description: เช่น 100 บาท หรือ 15%
        type: number
      expires_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      max_discount:
        description: เพดานลดสูงสุด (กรณีคิดเป็น %)
        type: number
      min_spend:
        description: ยอดซื้อขั้นต่ำ
        type: number
      starts_at:
        type: string
      title:
        type: string
      total_quota:
        type: integer
      used_count:
        type: integer
    type: object
  domain.RegisterInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  domain.UpdateProductInput:
    properties:
      brand_id:
        type: integer
      category_id:
        type: integer
      description:
        type: string
      image_url:
        type: string
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      specs:
        additionalProperties: {}
        type: object
      stock:
        type: integer
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
  domain.ValidationResult:
    properties:
      discount_amount:
        type: number
      final_total:
        type: number
      promotion:
        $ref: '#/definitions/domain.Promotion'
      subtotal:
        type: number
    type: object
  promotion.ValidateCouponRequest:
    properties:
      code:
        type: string
      subtotal:
        type: number
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/oopbest/go-2_e-commerce-app
  description: High-performance production-ready E-Commerce Backend with JWT Auth,
    PostgreSQL, and Redis Cache.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go E-Commerce REST API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password to receive JWT token
      parameters:
      - description: User Login Credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User Login
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new customer account and return a JWT token
      parameters:
      - description: User Registration Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
  /api/brands:
    get:
      description: Retrieve a list of all brands (Cached in Redis)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Brand'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all brands
      tags:
      - Brands
  /api/flash-sales/active:
    get:
      description: ดึงข้อมูลแคมเปญ Flash Sale ที่กำลังทำงาน พร้อมรายการสินค้า ราคาพิเศษ
        และโควตาสต็อก
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.FlashSale'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current active flash sale (ดึงแคมเปญ Flash Sale ปัจจุบัน)
      tags:
      - FlashSales
  /api/orders:
    get:
      description: 'Get list of orders (Customer: own orders, Admin: all orders)'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user orders
      tags:
      - Orders
  /api/orders/{id}:
    get:
      description: Get detailed order information by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - Orders
  /api/orders/checkout:
    post:
      consumes:
      - application/json
      description: Create an order with atomic stock deduction in database transaction
      parameters:
      - description: Cart Items to Checkout
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CheckoutInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Order'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Checkout order
      tags:
      - Orders
  /api/payments/confirm:
    post:
      consumes:
      - application/json
      description: จำลองการยืนยันการจ่ายเงินสำเร็จ (เปลี่ยน orders.status เป็น 'paid'
        และบันทึกใบเสร็จ)
      parameters:
      - description: Transaction confirmation data from Gateway
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.ConfirmPaymentInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Payment'
        "400":
          description: Invalid payload, status, or amount mismatch
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm Payment / Webhook (ยืนยันการชำระเงิน)
      tags:
      - Payments
  /api/payments/intent:
    post:
      consumes:
      - application/json
      description: สร้าง Payment Intent (เช่น PromptPay QR Code หรือ URL สำหรับบัตรเครดิต)
        ตาม Order ID
      parameters:
      - description: Order ID and Payment Method (credit_card, promptpay, truemoney)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.CreatePaymentIntentInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.PaymentIntentResponse'
        "400":
          description: Invalid request body or order status
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Order not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Payment Intent (ขอรับช่องทางชำระเงิน)
      tags:
      - Payments
  /api/payments/orders/{id}:
    get:
      description: ดึงข้อมูลประวัติการชำระเงินตาม Order ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Payment'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Payment record or order not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Payment Receipt (ดูใบเสร็จการชำระเงิน)
      tags:
      - Payments
  /api/products:
    get:
      description: Retrieve a list of all products (Cached in Redis)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Product'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Create a new product (Admin Only)
      parameters:
      - description: Create Product Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.CreateProductInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new product
      tags:
      - Products
  /api/products/{id}:
    delete:
      description: Delete product by ID (Admin Only)
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - Products
    get:
      description: Retrieve single product details by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get product by ID
      tags:
      - Products
    put:
      consumes:
      - application/json
      description: Update product details by ID (Admin Only)
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Product Data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateProductInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Product'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - Products
  /api/promotions:
    get:
      description: ดึงรายการคูปองส่วนลดทั้งหมดที่ยังเปิดใช้งานและยังไม่หมดอายุ
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Promotion'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get active promotions (คูปองส่วนลดที่ใช้งานได้)
      tags:
      - Promotions
  /api/promotions/validate:
    post:
      consumes:
      - application/json
      description: ตรวจสอบรหัสคูปองกับยอดรวมคำสั่งซื้อ พร้อมคำนวณยอดส่วนลดสุทธิ
      parameters:
      - description: Coupon Code and Subtotal
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/promotion.ValidateCouponRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ValidationResult'
        "400":
          description: Invalid coupon or conditions not met
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Coupon not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Validate coupon code (ตรวจสอบและคำนวณส่วนลด)
      tags:
      - Promotions
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      eyJhbGciOi..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
